<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- 表单元素标签form action属性表单提交到服务器地址 -->
    <form action="test.php">
        <!-- 表单元素 -->
        <!-- 明文输入框 -->
        用户：<input type="text">
        <!-- 暗文输入框 -->
        密码：<input type="password"><br>
        <!-- br表示强制换行 -->
        <!-- 单选按钮 如果想要单选按钮出现互斥效果 得加到同一个选项组-->
        性别：
        男：<input type="radio" name="gender" value="male">
        女：<input type="radio" name="gender" value="famale"><br>
        <!-- 复选框 -->
        爱好：
        篮球：<input type="checkbox" name="hobbies" id="basketball">
        足球：<input type="checkbox" name="hobbies" id="football">
        游泳：<input type="checkbox" name="hobbies" id="swimming">
        <!-- 分割线 hr -->
        <hr>
        <!-- 下拉框 -->
        <select name="city">
            <!-- 对下拉选项进行分组 shift+alt+f格式化文档 -->
            <optgroup label="一线城市">
                <option value="taiyuan">太原</option>
                <option value="jinzhong">晋中</option>
                <option value="datong">大同</option>
            </optgroup>
            <optgroup label="二线城市">
                <option value="shanghai">上海</option>
                <option value="beijing">北京</option>
                <option value="guangzhou">广州</option>
            </optgroup>
        </select>
        <!-- 多行文本框 cols表示列 rows表示行-->
         <textarea cols="30" rows="10"></textarea>
         <!-- 日期选择器 -->
          <input type="date">
        <!-- 时间日期选择器 -->
         <input type="datetime-local">
    </form>
</body>

</html>
