<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            /* 合并单元格边框*/
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <!-- 
        表格标签 table
        tr 表示一行
        td 表示一列中的一个单元格
        快捷键：tr>td*3  tr*2>td*3
        border属性：表示边框
        cellspacing：表示单元格和单元格之间的距离
        width：宽
        height：高
        align：设置表格对齐方式 左中右 left center right
    -->
    <table background="../音视频/6.jpg" bgcolor="yellow" width="400px" height="300px" align="center" border="1" cellspacing="0">
        <tr bgcolor="green">
            <!--ctrl+d 跳转到下一个同名单词-->
            <td>姓名</td>
            <td>性别</td>
            <td>年龄</td>
        </tr>
        <tr>
            <td>Peter</td>
            <td>male</td>
            <td>28</td>
        </tr>
        <tr>
            <td>Alice</td>
            <td>female</td>
            <td>20</td>
        </tr>
    </table>
</body>
</html>
