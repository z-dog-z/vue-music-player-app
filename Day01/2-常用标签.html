<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width:100px;
            height:100px;
            background-color: aquamarine;
        }
        span{
            width:100px;
            height:100px;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <!-- 从功能元素分类：1.块级元素2.行内元素 -->
    <!-- 1.块级元素
         特点：1.独占一行空间
         2.宽度默认是100%
         3.可以通过css属性设置宽高
         4.高度默认情况由元素内容撑起
    div p h1-h6 section（块级元素）
    -->
    <div>块级元素</div>
    <div>块级元素</div>
    <p>段落标签</p>
    <h1>一级标题</h1>
    <h2>二级标签</h2>
    <h3>三级标签</h3>
    <h4>四级标签</h4>
    <h5>五级标签</h5>
    <h6>六级标签</h6>
    <section>块级元素</section>
    <!-- 2.行内元素：
        特点：1.与其他行内元素共享一行空间
        2.高度默认由元素内容撑起
        3.通过css属性设置宽高不生效
    -->
    <span>行内元素</span>
    <span>行内元素</span>
    <em>斜体标签</em>
    <i>斜体标签</i>
    <b>加粗标签</b>
    <strong>加粗标签</strong>
    <sub>下标标签</sub>
    <sup>上标标签</sup>
</body>
</html>
