<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*盒子模型
          盒子模型种类：1.内容盒子 标准盒子 w3c盒子
          盒子宽：156px(内容区宽 + 左右内边距 + 左右边框)
          盒子高：165培训(内容区高 + 上下内边距 + 上下边框)
          盒子所占页面宽：192px(盒子宽 + 左右外边距)
          盒子所占页面高：234px(盒子高 + 上下外边距)
        */
        div{
            /*设置盒模型，默认所有块级元素都是内容盒子*/
            box-sizing: content-box;
            width: 100px;
            height: 100px;
           /*渐变背景色 线性渐变*/
           background-image: linear-gradient(red,yellow,pink);
           margin: 23px 17px 46px 19px;
           padding: 15px 27px 44px 23px;
           border: 3px solid red;
        }
    </style>
</head>
<body>
    <div>内容盒子</div>
</body>
</html>
