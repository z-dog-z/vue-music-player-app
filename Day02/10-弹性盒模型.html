<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            width: 500px;
            height: 400px;
            border: 1px solid red;
            /*容器水平居中*/
            margin: 0 auto;
            /*设置弹性盒
              给父元素设置弹性盒后 子元素成为弹性元素 弹性元素沿着主轴方向排列
            */
            display: flex;
            /*更改主轴排列方向 默认row（水平） column（垂直） row-reverse column-reverse交换器点和终点的位置*/
            /*flex-direction: row;*/
            /*当弹性元素宽度超过父容器宽度，是会进行等比例压缩而不是换行
              wrap为换行，nowrap为不换行（默认值）
            */
            /*flex-wrap: wrap;*/
            /*flex-directon flex-wrap简写为flex-flow
            flex-flow: column nowrap;
            */

            /*更改弹性元素在主轴的对齐方式*/
            /* justify-content: center; */
            /*更改弹性元素在交叉轴对齐方式*/
            /* align-items: center; */
        }
        .child{
            /* width: 100px; */
            /*用于分父元素*/
            flex: 1;
            height: 60px;
            color: white;
        }
        .second{
            flex: 2;
        }
    </style>
</head>
<body>
        <!-- 仿网易云音乐APP -->
    <div class="parent">
        <div class="child" style="background-color: red;">弹性元素1</div>
        <div class="child second" style="background-color: green;">弹性元素2</div>
        <div class="child" style="background-color: blue;">弹性元素3</div>
        <!-- <div class="child" style="background-color: red;">弹性元素1</div>
        <div class="child" style="background-color: green;">弹性元素2</div>
        <div class="child" style="background-color: blue;">弹性元素3</div> -->
    </div>
</body>
</html>
