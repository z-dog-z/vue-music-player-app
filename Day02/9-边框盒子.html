<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*盒子模型 
        2.边框盒子 IE盒子 怪异盒子
        盒子宽：100px
        盒子高：100px
        内容区宽：49px(width-左右内边框-左右边框)
        内容区高：px(height-上下内边距-上下边框)
        盒子所占页面宽：153px(width+左右外边距)
        盒子所占页面高：148px(height+上下外边距)
        */
        /*盒模型区别？
          1.内容盒子宽高是设置给内容区
          2.边框盒子宽高是设置给盒子本身的
        */
        div{
            /*设置盒子模型为边框盒子*/
            box-sizing: border-box;
            width:100px;
            height: 100px;
            /*径向渐变*/
            background-image: radial-gradient(red,yellow,pink);
            margin: 12px 29px 36px 24px;
            padding: 18px 33px 21px 16px;
            border: 1px solid red;
        }
    </style>
</head>
<body>
    <div>边框盒子</div>
</body>
</html>
